# "v" ile başlayan bir etiket gönderildiğinde (ör. git tag v0.2.0 && git push --tags)
# Windows kurulum dosyasını derler ve taslak bir GitHub Release oluşturur.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Anahtar taraması
        run: node scripts/check-secrets.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PDF Okuyucu ${{ github.ref_name }}"
          releaseBody: "Windows kurulum dosyası aşağıda. İlk açılışta Windows SmartScreen uyarısı çıkarsa “Ek bilgi → Yine de çalıştır” deyin."
          releaseDraft: true
          prerelease: false
