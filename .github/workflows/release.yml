# "v" ile başlayan bir etiket gönderildiğinde (ör. git tag v0.2.0 && git push --tags)
# Windows kurulum dosyasını ve taşınabilir exe'yi derleyip GitHub Release olarak yayınlar.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Yazma izinli token .git/config içinde kalmasın; gereken adımlar token'ı env ile alır
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Anahtar taraması
        run: node scripts/check-secrets.mjs

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PDF Okuyucu ${{ github.ref_name }}"
          releaseBody: |
            ## İndirme
            - **`..._x64-setup.exe`**: Kurulum dosyası (önerilen). Çift tıklayın, yönetici izni istemez; masaüstü ve Başlat menüsü kısayolu oluşturur.
            - **`..._portable.exe`**: Kurulumsuz tek dosya. İstediğiniz klasöre koyup çalıştırın.

            ## “Windows bilgisayarınızı korudu” uyarısı
            Uygulama kod imzalı olmadığı için Windows SmartScreen bu uyarıyı gösterebilir. **Ek bilgi → Yine de çalıştır** deyin. Kaynak kodun tamamı bu depodadır ve dosya GitHub Actions üzerinde derlenmiştir.
          releaseDraft: false
          prerelease: false

      # Kurulumsuz (taşınabilir) exe'yi de aynı sürüme ekle
      - name: Taşınabilir exe yükle
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $out = "PDF-Okuyucu_${tag}_portable.exe"
          Copy-Item src-tauri/target/release/pdf-okuyucu.exe $out
          gh release upload $tag $out --clobber
