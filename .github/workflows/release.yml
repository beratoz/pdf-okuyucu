# "v" ile başlayan bir etiket gönderildiğinde (ör. git tag v0.2.0 && git push --tags)
# Windows kurulum dosyasını derler ve taslak bir GitHub Release oluşturur.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Anahtar taraması
        run: node scripts/check-secrets.mjs

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PDF Okuyucu ${{ github.ref_name }}"
          releaseBody: "Windows kurulum dosyası aşağıda. İlk açılışta Windows SmartScreen uyarısı çıkarsa “Ek bilgi → Yine de çalıştır” deyin."
          releaseDraft: true
          prerelease: false
