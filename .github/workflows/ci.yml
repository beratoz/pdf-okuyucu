name: CI

on:
  push:
    branches: [main]
  pull_request:

# En az yetki: CI yalnızca kodu okur
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Anahtar taraması
        run: node scripts/check-secrets.mjs

      - name: Bağımlılıklar
        run: npm ci

      - name: Arayüz (TypeScript + Vite)
        run: npm run build

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Rust testleri
        working-directory: src-tauri
        run: cargo test --lib
